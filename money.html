<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Money Tracker</title>
    <style>
        /* Colours - light mode */
        :root {
            --page-bg: #f4f4f9;
            --text: #333;
            --heading: #2c3e50;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.05);
            --muted: #7f8c8d;
            --faint: #95a5a6;
            --line: #eee;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --accent: #2980b9;
            --accent-hover: #2471a3;
            --balance-bg: #e8f4f8;
            --balance-border: #d1e8f0;
            --balance-label: #555;
            --handle: #bdc3c7;
            --action-bg: #e0e4e8;
            --action-bg-hover: #cbd0d5;
            --expense: #e74c3c;
            --income: #27ae60;
        }
        /* Colours - dark mode */
        body.dark {
            color-scheme: dark; /* makes the date picker and dropdown dark too */
            --page-bg: #15171c;
            --text: #e4e6eb;
            --heading: #f0f2f5;
            --card-bg: #1f2229;
            --card-shadow: rgba(0,0,0,0.4);
            --muted: #9aa3ad;
            --faint: #7f8893;
            --line: #2e323b;
            --input-bg: #15171c;
            --input-border: #444a55;
            --accent: #4aa3df;
            --accent-hover: #3b8ec6;
            --balance-bg: #1b2a36;
            --balance-border: #27414f;
            --balance-label: #b0b8c1;
            --handle: #5c6470;
            --action-bg: #343a45;
            --action-bg-hover: #434b58;
            --expense: #ff6b5b;
            --income: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--page-bg);
            color: var(--text);
            max-width: 550px;
            margin: 2rem auto;
            padding: 0 1rem;
            transition: background-color 0.2s, color 0.2s;
        }
        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px var(--card-shadow);
            margin-bottom: 1.5rem;
        }
        h1, h2, h3 { margin-top: 0; color: var(--heading); }

        /* Page header with dark mode toggle */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.3rem;
        }
        .page-header h1 { margin: 0; }
        .theme-toggle {
            background: var(--action-bg);
            color: var(--text);
            padding: 8px 12px;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .theme-toggle:hover { background: var(--action-bg-hover); }

        /* Total Display Box */
        .balance-box {
            text-align: center;
            background: var(--balance-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--balance-border);
        }
        .balance-box p { margin: 0 0 5px 0; color: var(--balance-label); font-weight: bold; }
        .balance-box h2 { margin: 0; font-size: 2.5rem; color: var(--accent); }
        .balance-box h2.negative { color: var(--expense); }

        /* Form Layout */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .form-group-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text);
        }
        input[type="text"], input[type="date"] { flex: 2; }
        input[type="number"] { flex: 1; }

        button {
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-blue { background: var(--accent); width: 100%; }
        .btn-blue:hover { background: var(--accent-hover); }
        .btn-green { background: #27ae60; width: 100%; }
        .btn-green:hover { background: #219653; }

        /* Ledger / List */
        .ledger-item {
            position: relative; /* so the drop line can be positioned on the row */
            display: flex;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            background: var(--card-bg);
            transition: background 0.2s;
        }
        .ledger-item:last-child { border-bottom: none; }

        /* Drag and drop visual: the dotted line is drawn on top of the rows
           (not as part of them), so the rows don't move when it appears. */
        .ledger-item.drop-above::before,
        .ledger-item.drop-below::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            border-top: 2px dashed var(--accent);
            pointer-events: none;
            z-index: 1;
        }
        .ledger-item.drop-above::before { top: -1px; }
        .ledger-item.drop-below::after { bottom: -1px; }

        .drag-handle {
            cursor: grab;
            color: var(--handle);
            padding-right: 15px;
            font-size: 1.2rem;
            user-select: none;
        }
        .drag-handle:active { cursor: grabbing; }

        .item-left { flex-grow: 1; display: flex; flex-direction: column; }
        .item-desc { font-weight: 500; }
        .item-date { font-size: 0.8em; color: var(--muted); margin-top: 2px; }

        .item-right { text-align: right; margin-right: 15px; min-width: 80px; }
        .item-amount { font-weight: bold; font-size: 1.1em; }
        .running-total { font-size: 0.85em; color: var(--faint); margin-top: 2px; }

        .item-actions { display: flex; gap: 5px; }
        .action-btn {
            background: var(--action-bg);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .action-btn:hover { background: var(--action-bg-hover); }

        .expense { color: var(--expense); }
        .income { color: var(--income); }

        .empty-state { text-align: center; color: var(--faint); font-style: italic; }
        hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0; }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>Money Tracker</h1>
        <button type="button" id="themeToggle" class="theme-toggle">🌙 Dark mode</button>
    </div>

    <div class="balance-box">
        <p>Current Total</p>
        <h2 id="displayTotal">£0.00</h2>
    </div>

    <!-- Shown only while there are no items -->
    <div class="card" id="startCard">
        <h3>Set Current Amount</h3>
        <form id="startForm">
            <div class="form-group">
                <input type="number" id="startAmount" placeholder="Enter starting £" step="0.01" required>
                <button type="submit" class="btn-blue">Set Starting Total</button>
            </div>
        </form>
    </div>

    <!-- Shown only once there are items -->
    <div class="card" id="formCard">
        <h3 id="formTitle">Add Income or Expense</h3>
        <form id="transactionForm">
            <div class="form-group-column">
                <div class="form-group">
                    <input type="text" id="desc" placeholder="Reference (optional)">
                    <input type="number" id="amount" placeholder="Amount (£)" step="0.01" required>
                </div>
                <div class="form-group">
                    <input type="date" id="date">
                    <select id="type">
                        <option value="expense">Expense (-)</option>
                        <option value="income">Income (+)</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn" class="btn-green">Add to Tracker</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h3>Tracker History</h3>
        <div id="ledgerList">
            <div class="empty-state">No transactions added yet.</div>
        </div>
    </div>

    <script>
        // Load existing data from the browser, or start fresh
        let transactions = JSON.parse(localStorage.getItem('myBudgetTracker')) || [];
        let editingItem = null; // The transaction currently being edited (null when adding a new one)

        // Formatting currency: £5.00, or -£5.00 for a negative amount.
        // Rounding to whole pence first stops a tiny rounding error showing as "-£0.00".
        const toPence = (amount) => Math.round(amount * 100);
        const formatMoney = (amount) => {
            const pence = toPence(amount);
            return (pence < 0 ? "-" : "") + "£" + (Math.abs(pence) / 100).toFixed(2);
        };

        // Save to browser storage
        const saveData = () => localStorage.setItem('myBudgetTracker', JSON.stringify(transactions));

        // DOM Elements
        const displayTotal = document.getElementById('displayTotal');
        const startCard = document.getElementById('startCard');
        const startForm = document.getElementById('startForm');
        const formCard = document.getElementById('formCard');
        const transactionForm = document.getElementById('transactionForm');
        const ledgerList = document.getElementById('ledgerList');
        const submitBtn = document.getElementById('submitBtn');
        const formTitle = document.getElementById('formTitle');
        const themeToggle = document.getElementById('themeToggle');

        // Dark mode: remembered in the browser; if never chosen, follows the device setting
        function applyTheme(dark) {
            document.body.classList.toggle('dark', dark);
            themeToggle.textContent = dark ? '☀️ Light mode' : '🌙 Dark mode';
        }
        const savedTheme = localStorage.getItem('myBudgetTheme');
        applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);

        themeToggle.addEventListener('click', function() {
            const dark = !document.body.classList.contains('dark');
            applyTheme(dark);
            localStorage.setItem('myBudgetTheme', dark ? 'dark' : 'light');
        });

        // Initial Load
        updateUI();

        // Leave edit mode: clear the form and put it back to "add" mode
        function stopEditing() {
            editingItem = null;
            submitBtn.textContent = 'Add to Tracker';
            formTitle.textContent = 'Add Income or Expense';
            transactionForm.reset();
        }

        // 1. Handle Setting Starting Balance (only possible while the list is empty)
        startForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const startAmount = parseFloat(document.getElementById('startAmount').value);

            transactions = [{
                desc: "Starting Balance",
                amount: startAmount,
                type: "income",
                date: ""
            }];

            document.getElementById('startAmount').value = '';
            saveData();
            updateUI();
        });

        // 2. Handle Adding/Editing Transactions
        transactionForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const date = document.getElementById('date').value;

            // Look up where the item being edited is right now, so it is still
            // found if rows were reordered or deleted since Edit was clicked
            const editPosition = editingItem ? transactions.indexOf(editingItem) : -1;

            if (editPosition > -1) {
                // We are updating an existing item
                transactions[editPosition] = { desc, amount, type, date };
            } else {
                // We are adding a new item
                transactions.push({ desc, amount, type, date });
            }

            stopEditing(); // also clears the form
            saveData();
            updateUI();
        });

        // Edit Function
        window.editItem = function(index) {
            const t = transactions[index];
            document.getElementById('desc').value = t.desc || '';
            document.getElementById('amount').value = t.amount;
            document.getElementById('type').value = t.type;
            document.getElementById('date').value = t.date || '';

            editingItem = t;
            submitBtn.textContent = 'Update Transaction';
            formTitle.textContent = 'Editing Transaction';
            formCard.scrollIntoView({ behavior: 'smooth' });
        };

        // Delete Function
        window.deleteItem = function(index) {
            if (confirm("Delete this item?")) {
                // Deleting the row that is being edited cancels the edit
                if (transactions[index] === editingItem) stopEditing();

                transactions.splice(index, 1);
                saveData();
                updateUI();
            }
        };

        // --- Drag and Drop Functions ---
        // A "slot" is a gap between rows: 0 = above the first row, 1 = above the
        // second row, ... and one past the last row = at the bottom of the list.
        let dragStartIndex = null; // null means no row is being dragged
        let dropSlot = null;       // the slot the dotted line is currently shown at (null = none)

        // Top half of a row = the slot above it, bottom half = the slot below it
        function slotUnderPointer(row, e) {
            const rect = row.getBoundingClientRect();
            const index = +row.dataset.index;
            return e.clientY < rect.top + rect.height / 2 ? index : index + 1;
        }

        // The slots directly above and below the dragged row would leave it
        // exactly where it started, so neither of those counts as a move.
        function wouldMove(slot) {
            return dragStartIndex !== null &&
                   slot !== dragStartIndex &&
                   slot !== dragStartIndex + 1;
        }

        // Draw the dotted line at one slot (pass null to draw it nowhere)
        function setDropLine(slot) {
            dropSlot = slot;
            const rows = ledgerList.querySelectorAll('.ledger-item');
            rows.forEach((row, i) => {
                row.classList.toggle('drop-above', slot === i);
                row.classList.toggle('drop-below', slot === rows.length && i === rows.length - 1);
            });
        }

        function dragStart(e) {
            dragStartIndex = +this.dataset.index;
            e.dataTransfer.effectAllowed = 'move';
        }

        // Runs for both dragenter and dragover
        function dragOver(e) {
            if (dragStartIndex === null) return; // something other than one of our rows is being dragged
            e.preventDefault();
            const slot = slotUnderPointer(this, e);
            setDropLine(wouldMove(slot) ? slot : null);
        }

        function dragLeave(e) {
            // This fires whenever the pointer moves between elements, including the
            // text and buttons inside rows. Only clear the line once it has left the list.
            const nowOver = e.relatedTarget || document.elementFromPoint(e.clientX, e.clientY);
            if (nowOver && ledgerList.contains(nowOver)) return;
            setDropLine(null);
        }

        function dragDrop(e) {
            e.stopPropagation();
            const from = dragStartIndex;
            const slot = dropSlot; // land exactly where the line was showing
            dragEnd();
            if (from === null || slot === null) return; // dropped where it started - nothing to do

            const itemToMove = transactions.splice(from, 1)[0];
            // Removing the row shifts every slot below it up by one
            const insertIndex = slot > from ? slot - 1 : slot;
            transactions.splice(insertIndex, 0, itemToMove);

            saveData();
            updateUI();
        }

        // Tidy up when a drag finishes or is cancelled
        function dragEnd() {
            dragStartIndex = null;
            setDropLine(null);
        }

        // 3. Update the Screen
        function updateUI() {
            ledgerList.innerHTML = '';
            let runningTotal = 0;

            // Show "Set Current Amount" until there are items, then swap to "Add Income or Expense"
            const hasItems = transactions.length > 0;
            startCard.hidden = hasItems;
            formCard.hidden = !hasItems;

            if (!hasItems) {
                ledgerList.innerHTML = '<div class="empty-state">No transactions added yet.</div>';
                displayTotal.textContent = "£0.00";
                displayTotal.classList.remove('negative');
                return;
            }

            // Build the list
            transactions.forEach((t, index) => {
                if (t.type === 'income') runningTotal += t.amount;
                else runningTotal -= t.amount;

                // Format date only if one was entered
                let dateString = '';
                if (t.date) {
                    const dateObj = new Date(t.date);
                    dateString = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                }

                // Income normally shows as a plus and an expense as a minus. A negative
                // amount (e.g. an overdrawn starting balance) flips that.
                const isMinus = t.type === 'income' ? t.amount < 0 : t.amount >= 0;
                const sign = isMinus ? '-' : '+';
                const colorClass = isMinus ? 'expense' : 'income';
                const displayName = t.desc ? t.desc : '<em>No reference</em>';

                const div = document.createElement('div');
                div.className = 'ledger-item';
                div.draggable = true;
                div.dataset.index = index;

                div.innerHTML = `
                    <div class="drag-handle" title="Drag to reorder">☰</div>
                    <div class="item-left">
                        <span class="item-desc">${displayName}</span>
                        <span class="item-date">${dateString}</span>
                    </div>
                    <div class="item-right">
                        <div class="item-amount ${colorClass}">${sign}${formatMoney(Math.abs(t.amount))}</div>
                        <div class="running-total">= ${formatMoney(runningTotal)}</div>
                    </div>
                    <div class="item-actions">
                        <button onclick="editItem(${index})" class="action-btn" title="Edit">✎</button>
                        <button onclick="deleteItem(${index})" class="action-btn" title="Delete">✖</button>
                    </div>
                `;

                // Add drag and drop event listeners
                div.addEventListener('dragstart', dragStart);
                div.addEventListener('dragenter', dragOver);
                div.addEventListener('dragover', dragOver);
                div.addEventListener('dragleave', dragLeave);
                div.addEventListener('drop', dragDrop);
                div.addEventListener('dragend', dragEnd);

                ledgerList.appendChild(div);
            });

            // Update big number
            displayTotal.textContent = formatMoney(runningTotal);
            displayTotal.classList.toggle('negative', toPence(runningTotal) < 0);
        }
    </script>
</body>
</html>
